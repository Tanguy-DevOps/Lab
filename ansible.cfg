[defaults]
# Dossier tmp rooted dans /tmp, séparé par utilisateur pour éviter les conflits
# avec become:true (root) et l'utilisateur tanguy
remote_tmp = /tmp/.ansible/tmp/{{ ansible_user }}

# Inventaire
inventory = ./inventory/hosts.ini

# Vérification de la clé SSH activée (sécurisé)
# Les clés sont gérées automatiquement par deploy.sh via ssh-keyscan
host_key_checking = True

# Utilisateur SSH par défaut
remote_user = tanguy

# Clé SSH explicite
private_key_file = ~/.ssh/id_ed25519

# Pas de fichiers .retry qui polluent le projet
retry_files_enabled = False

# Détection silencieuse de l'interpréteur Python
interpreter_python = auto_silent

# Chemin local des collections (isole community.docker du global)
collections_path = ./collections

# Timeout de connexion généreux pour laisser cloud-init finir
timeout = 30

[ssh_connection]
# ControlMaster : réutilise la même connexion SSH → gain de temps
# Pas de StrictHostKeyChecking=no car host_key_checking = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

# Pipelining désactivé : incompatible avec become:true quand
# le dossier tmp change d'utilisateur (root vs tanguy)
pipelining = False