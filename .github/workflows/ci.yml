name: CI

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
      - "infra/**"
      - "fix/**"
      - "docs/**"
  pull_request:

jobs:
  validate:
    name: Validate Terraform, Ansible and Shell
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install ansible-core ansible-lint

      - name: Prepare Terraform variable file for validation
        run: cp terraform.tfvars.example terraform.tfvars

      - name: Terraform format
        run: terraform fmt -check

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Ansible lint
        run: ansible-lint setup_web.yml

      - name: Ansible syntax check
        run: ansible-playbook --syntax-check setup_web.yml

      - name: Shell syntax check
        run: |
          bash -n deploy.sh
          bash -n destroy.sh

  security:
    name: Security Scans
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        run: >
          docker run --rm
          -v "${PWD}:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect
          --source=/repo
          --redact
          --verbose

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install checkov==3.2.508

      - name: Terraform security scan
        run: >
          checkov -d .
          --framework terraform
          --skip-path collections
          --skip-path .terraform
          --skip-path .terraform-cache
          --skip-download
          --quiet
